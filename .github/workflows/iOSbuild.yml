name: EX Emulators - FINAL IPA Build (Direct Make Fix)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Final Success Path)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install autoconf automake libtool make nasm pkg-config 
          
      - name: Select Xcode 16.4.0
        uses: maxim-lobanov/setup-xcode@v1 
        with:
          xcode-version: '16.4.0'
          
      # --- 关键修复：移除失败的 setup script，直接运行 make ---
      - name: Run Full Make Build for iOS
        run: |
          JOBS=`sysctl -n hw.ncpu`
          echo "Building dependencies and application with $JOBS cores"
          
          # 1. 编译 imagine 核心库
          # 我们在项目根目录运行，让它使用相对路径 (make/...)
          make -f imagine/ios-release.mk install V=1 -j$JOBS
          
          # 2. 编译 EmuFramework 核心库
          make -f EmuFramework/ios-release.mk install V=1 -j$JOBS
          
          # 3. 编译 2600.emu 应用
          make -f 2600.emu/ios-release.mk install V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 在项目根目录查找生成的 .app bundle
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: 找不到 .app 文件。编译已失败。请检查日志中 make 命令的错误。"
            exit 1
          fi
          
          IPA_NAME="2600Emu-IPA-Final.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-Final
          path: 2600Emu-IPA-Final.ipa
