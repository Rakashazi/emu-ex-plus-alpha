name: EX Emulators - Fast IPA Build

on: [push, pull_request]

jobs:
  build_ipa_2600emu:
    name: Build 2600.emu IPA (Fast Test)
    # 仅在 macOS 运行器上运行
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 确保获取完整历史，以便 make 脚本能够正常工作
          fetch-depth: 0
          
      - name: Set up dependencies (Homebrew)
        run: |
          brew update
          # 安装 iOS 构建所需的依赖
          brew install autoconf automake libtool make nasm pkg-config 
          
      - name: Set up Xcode environment
        # 确认使用一个可用的 Xcode 版本，这是必需的
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
        
      - name: Run Full Make Build for iOS
        run: |
          # 自动获取核心数以加速编译
          JOBS=`sysctl -n hw.ncpu`
          echo "Building with $JOBS cores"
          
          # 1. 编译 imagine 核心库
          make -f imagine/ios-release.mk install V=1 -j$JOBS
          
          # 2. 编译 EmuFramework 核心库
          make -f EmuFramework/ios-release.mk install V=1 -j$JOBS
          
          # 3. 编译 2600.emu 应用的核心代码
          make -f 2600.emu/ios-release.mk install V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 1. 查找生成的 .app bundle。它应该位于项目根目录的某个 target/ios-release 路径下
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: Could not find the .app file. Build failed or path is incorrect."
            exit 1
          fi
          
          echo "Found APP_PATH: $APP_PATH"
          
          # 2. 打包 IPA (TrollStore 侧载格式)
          IPA_NAME="2600Emu-TrollStore-Test.ipa"
          mkdir Payload
          # 复制 .app 文件到 Payload 目录
          cp -R "$APP_PATH" Payload/
          # 压缩成 IPA 文件
          zip -r "$IPA_NAME" Payload
          
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-Test
          path: 2600Emu-TrollStore-Test.ipa