name: EX Emulators - FINAL IPA Build (Test 2600.emu only)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Test Only)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          # 安装 iOS 构建所需的核心依赖
          brew install autoconf automake libtool make nasm pkg-config 
          
      # --- 关键修复：更换为正确的 Xcode Setup Action ---
      - name: Select Xcode 15.3
        uses: maxim-lobanov/setup-xcode@v1 
        with:
          # 我们不再猜测路径，而是让 Action 自动找到 Xcode 15.3
          xcode-version: '15.3'
          
      - name: Run Make Build for 2600.emu
        run: |
          JOBS=`sysctl -n hw.ncpu`
          echo "Building 2600.emu with $JOBS cores"
          
          # 仅编译 2600.emu，假设它会自动处理核心依赖
          make -f 2600.emu/ios-release.mk install V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 查找生成的 .app bundle
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: Could not find the .app file. The build likely failed due to missing dependencies."
            exit 1
          fi
          
          IPA_NAME="2600Emu-TestOnly.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-TestOnly
          path: 2600Emu-TestOnly.ipa
