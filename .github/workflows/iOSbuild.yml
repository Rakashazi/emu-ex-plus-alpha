name: EX Emulators - FINAL IPA Build (Project Root Fix)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Final Dual Path Fix)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install autoconf automake libtool make nasm pkg-config 
          
      - name: Select Xcode 16.4.0
        uses: maxim-lobanov/setup-xcode@v1 
        with:
          xcode-version: '16.4.0'
          
      - name: Run Full Make Build for iOS
        run: |
          JOBS=`sysctl -n hw.ncpu`
          echo "Building dependencies and application with $JOBS cores"
          
          # ⚠️ 关键修改：同时注入 IMAGINE_PATH 和 PROJECT_ROOT
          # PROJECT_ROOT 变量将用于修复 /shortcut/ 路径
          ROOT_PATH_ARG="IMAGINE_PATH=${{ github.workspace }} PROJECT_ROOT=${{ github.workspace }}"
          
          # 1. 编译 imagine 核心库
          make -f imagine/ios-release.mk install $ROOT_PATH_ARG V=1 -j$JOBS
          
          # 2. 编译 EmuFramework 核心库
          make -f EmuFramework/ios-release.mk install $ROOT_PATH_ARG V=1 -j$JOBS
          
          # 3. 编译 2600.emu 应用
          make -f 2600.emu/ios-release.mk install $ROOT_PATH_ARG V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 查找生成的 .app bundle
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: 找不到 .app 文件。编译已失败。请检查日志中的 make 步骤是否产生新的错误。"
            exit 1
          fi
          
          IPA_NAME="2600Emu-Final-Success.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-Final-Success
          path: 2600Emu-Final-Success.ipa
