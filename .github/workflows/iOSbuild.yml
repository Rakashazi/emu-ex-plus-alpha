name: EX Emulators iOS Build

on: [push, pull_request]

jobs:
  build:
    name: Build iOS base
    runs-on: macos-latest
    steps:
    - name: Checkout emu-ex-plus-alpha repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install build dependencies
      run: |
        brew install automake autoconf libtool
    
    - name: Debug Xcode environment
      run: |
        xcode-select --print-path
        xcodebuild -version
        echo "Current SDKROOT: $SDKROOT"
        echo "MacOS SDK path: $(xcrun --sdk macosx --show-sdk-path)"
        echo "iOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
        echo "Available SDKs: $(xcodebuild -showsdks)"
    
    - name: Set up environment
      run: |
        mkdir imagine-sdk
        echo "EMUFRAMEWORK_PATH=${{ github.workspace }}/EmuFramework" >> $GITHUB_ENV
        echo "IMAGINE_PATH=${{ github.workspace }}/imagine" >> $GITHUB_ENV
        echo "IMAGINE_SDK_PATH=${{ github.workspace }}/imagine-sdk" >> $GITHUB_ENV
        echo "COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
        # Set SDKROOT to the latest available SDK
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
    
    - name: Build and install imagine
      working-directory: ${{ github.workspace }}/imagine
      run: |
        # Build imagine with iOS support using arm64 architecture
        # Disable libarchive dependency and fix C++ header paths
        IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        CXX_INCLUDE_PATH="$IOS_SDK_PATH/usr/include/c++/v1"
        echo "Using iOS SDK path: $IOS_SDK_PATH"
        echo "Using C++ headers path: $CXX_INCLUDE_PATH"
        # Add inc_pkg_libarchive=0 to disable libarchive
        # Add -I${{ github.workspace }}/imagine/include to fix header paths
        make -f make/shortcut/common-builds/ios-arm64.mk prefix=${IMAGINE_SDK_PATH} install V=1 -j$(sysctl -n hw.ncpu) projectPath=${{ github.workspace }}/imagine \
          inc_pkg_libarchive=0 \
          USE_LIBARCHIVE=0 \
          ios_useExternalLibcxx=0 \
          CPPFLAGS="-I${{ github.workspace }}/imagine/include -I$CXX_INCLUDE_PATH -I$IOS_SDK_PATH/usr/include"
    
    - name: Build and install EmuFramework
      working-directory: ${{ github.workspace }}/EmuFramework
      run: |
        # Build EmuFramework with iOS support using arm64 architecture
        # Disable libarchive dependency and fix C++ header paths
        IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        CXX_INCLUDE_PATH="$IOS_SDK_PATH/usr/include/c++/v1"
        echo "Using iOS SDK path: $IOS_SDK_PATH"
        echo "Using C++ headers path: $CXX_INCLUDE_PATH"
        # Add inc_pkg_libarchive=0 to disable libarchive
        # Add -I${{ github.workspace }}/imagine/include to fix header paths
        make -f ${IMAGINE_PATH}/make/shortcut/common-builds/ios-arm64.mk prefix=${IMAGINE_SDK_PATH} install V=1 -j$(sysctl -n hw.ncpu) projectPath=${{ github.workspace }}/EmuFramework \
          inc_pkg_libarchive=0 \
          USE_LIBARCHIVE=0 \
          ios_useExternalLibcxx=0 \
          CPPFLAGS="-I${{ github.workspace }}/imagine/include -I$CXX_INCLUDE_PATH -I$IOS_SDK_PATH/usr/include"
    
    - name: Keep cache small
      run: rm -rf .git
    
    - name: Save cache
      uses: actions/cache/save@v4
      with:
        path: ./
        key: ${{ github.sha }}-ios-base

  build_ios_images:
    name: Build iOS images
    needs: [build]
    runs-on: macos-latest
    strategy:
      matrix:
        image: ["2600.emu", "C64.emu", "GBA.emu", "GBC.emu", "Lynx.emu", "MD.emu", "MSX.emu", "NEO.emu", "NES.emu", "NGP.emu", "PCE.emu", "Snes9x", "Swan.emu"]
    steps:
    - name: Install build dependencies
      run: |
        brew install gnu-tar
    
    - name: Restore cache
      uses: actions/cache/restore@v4
      with:
        path: ./
        key: ${{ github.sha }}-ios-base
        fail-on-cache-miss: true
    
    - name: Debug Xcode environment
      run: |
        xcode-select --print-path
        xcodebuild -version
        echo "Current SDKROOT: $SDKROOT"
        echo "MacOS SDK path: $(xcrun --sdk macosx --show-sdk-path)"
        echo "iOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
        echo "C++ headers path: $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/c++/v1"
    
    - name: Set up environment
      run: |
        echo "EMUFRAMEWORK_PATH=${{ github.workspace }}/EmuFramework" >> $GITHUB_ENV
        echo "IMAGINE_PATH=${{ github.workspace }}/imagine" >> $GITHUB_ENV
        echo "IMAGINE_SDK_PATH=${{ github.workspace }}/imagine-sdk" >> $GITHUB_ENV
        echo "COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
        # Set SDKROOT to the latest available SDK
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
    
    - name: Create EX-Emulators-iOS directory
      run: mkdir EX-Emulators-iOS
    
    - name: Build iOS app
      working-directory: ${{ matrix.image }}
      run: |
        # Set SDK paths
        IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        CXX_INCLUDE_PATH="$IOS_SDK_PATH/usr/include/c++/v1"
        echo "Using iOS SDK path: $IOS_SDK_PATH"
        echo "Using C++ headers path: $CXX_INCLUDE_PATH"
        
        # Set pkg-config path for imagine and EmuFramework
        export PKG_CONFIG_PATH=${IMAGINE_SDK_PATH}/lib/pkgconfig
        echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
        
        # List available pkg-config files to verify
        ls -la ${IMAGINE_SDK_PATH}/lib/pkgconfig/
        
        # Verify C++ headers exist
        ls -la "$CXX_INCLUDE_PATH" | head -10
        
        # Verify imagine and emuframework headers exist
        ls -la ${IMAGINE_SDK_PATH}/include/imagine/ | head -10
        ls -la ${IMAGINE_SDK_PATH}/include/emuframework/ | head -10
        
        # Build with proper SDK and C++ library includes
        make -f ios.mk ios-build V=1 ios_arch="arm64" minIOSVer="12.0" \
          PKG_CONFIG_PATH=${PKG_CONFIG_PATH} \
          inc_pkg_libarchive=0 \
          USE_LIBARCHIVE=0 \
          ios_useExternalLibcxx=0 \
          CPPFLAGS="-I${{ github.workspace }}/imagine/include -I$CXX_INCLUDE_PATH -I$IOS_SDK_PATH/usr/include -I${IMAGINE_SDK_PATH}/include" \
          CXXFLAGS="-stdlib=libc++" -j$(sysctl -n hw.ncpu)
        # Create IPA without signing
        cd target/${{ matrix.image }}
        mkdir -p Payload
        cp -r *.app Payload/
        zip -r "${{ github.workspace }}/EX-Emulators-iOS/${{ matrix.image }}-${COMMIT_PREFIX}.ipa" Payload/
    
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.image }}-iOS
        path: EX-Emulators-iOS/

  release:
    name: iOS Release
    runs-on: macos-latest
    needs: [build, build_ios_images]
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Download iOS Artifacts
      uses: actions/download-artifact@v4
      with:
        path: EX-Emulators-iOS
        merge-multiple: true
    
    - name: Re-ZIP artifacts
      working-directory: EX-Emulators-iOS
      run: |
        mkdir ../dist-ios
        COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)
        for artifact in *.ipa
        do
          file_name="${artifact%.ipa}"
          echo "-> Creating ${file_name//-${COMMIT_PREFIX}/}.zip"
          zip "../dist-ios/${file_name//-${COMMIT_PREFIX}/}.zip" "${file_name}.ipa"
        done
        zip -r "../dist-ios/EX-Emulators-iOS.zip" *.ipa
    
    - name: Update Git Tag
      run: |
        git tag -f Pre-release-iOS
        git push -f origin Pre-release-iOS
    
    - name: Create iOS Release
      uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release-iOS
        artifacts: "dist-ios/*.zip"
        name: "iOS Pre-release"
        body: "iOS builds for EX Emulators (unsigned, for TrollStore installation)"
