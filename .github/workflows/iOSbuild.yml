name: EX Emulators - FINAL IPA Build (Stable)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Stable)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          # 安装 iOS 构建所需的核心依赖
          brew install autoconf automake libtool make nasm pkg-config 
          
      # --- 关键修改：使用官方 Action 稳定设置 Xcode ---
      - name: Select Xcode 15.3
        uses: developer-action/xcode-select@v5
        with:
          # 我们不再猜测路径，而是让 Action 自动找到 Xcode 15.3
          version: '15.3'
          
      - name: Run Full Make Build for iOS
        run: |
          # 编译所有核心库和应用
          JOBS=`sysctl -n hw.ncpu`
          echo "Building with $JOBS cores"
          # 编译 imagine 核心库
          make -f imagine/ios-release.mk install V=1 -j$JOBS
          # 编译 EmuFramework 核心库
          make -f EmuFramework/ios-release.mk install V=1 -j$JOBS
          # 编译 2600.emu 应用的核心代码
          make -f 2600.emu/ios-release.mk install V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 查找生成的 .app bundle
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: Could not find the .app file. Build failed or make target path is wrong."
            exit 1
          fi
          
          IPA_NAME="2600Emu-Stable.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-Stable
          path: 2600Emu-Stable.ipa