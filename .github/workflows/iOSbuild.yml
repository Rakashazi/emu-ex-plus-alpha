name: EX Emulators - FINAL IPA Build (Recursive Make)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Final Recursive Fix)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install autoconf automake libtool make nasm pkg-config 
          
      - name: Select Xcode 16.4.0
        uses: maxim-lobanov/setup-xcode@v1 
        with:
          xcode-version: '16.4.0'
          
      # --- 关键修复：使用 make -C 进入子目录执行 ---
      - name: Run Full Make Build for iOS
        run: |
          JOBS=`sysctl -n hw.ncpu`
          echo "Building dependencies and application with $JOBS cores"
          
          # 1. 编译 imagine 核心库：进入目录，运行 ios-release.mk install 目标
          # -C imagine: 告诉 make 切换到 imagine 目录执行
          # -f ios-release.mk: 指定要运行的文件
          make -C imagine -f ios-release.mk install V=1 -j$JOBS
          
          # 2. 编译 EmuFramework 核心库
          make -C EmuFramework -f ios-release.mk install V=1 -j$JOBS
          
          # 3. 编译 2600.emu 应用
          make -C 2600.emu -f ios-release.mk install V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 查找生成的 .app bundle。它应该在 2600.emu/target/ios-release/ 下
          APP_PATH=$(find 2600.emu -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: 找不到 .app 文件。编译已失败。请检查日志中 Makefiles 的详细错误。"
            exit 1
          fi
          
          IPA_NAME="2600Emu-RecursiveFix.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-RecursiveFix
          path: 2600Emu-RecursiveFix.ipa
