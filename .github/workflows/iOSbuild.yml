name: EX Emulators - FINAL IPA Build (IMAGINE_PATH Fix)

on: [push, pull_request]

jobs:
  build_ipa_stable:
    name: Build 2600.emu IPA (Final Variable Fix)
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install autoconf automake libtool make nasm pkg-config 
          
      - name: Select Xcode 16.4.0
        uses: maxim-lobanov/setup-xcode@v1 
        with:
          xcode-version: '16.4.0'
          
      # --- 关键修复：定义 IMAGINE_PATH 变量 ---
      - name: Run Full Make Build for iOS
        run: |
          JOBS=`sysctl -n hw.ncpu`
          echo "Building dependencies and application with $JOBS cores"
          
          # ⚠️ 关键修改：将 IMAGINE_PATH 变量设置为项目根目录
          # 这将确保所有内部 Make 文件中的 $(IMAGINE_PATH)/... 路径解析正确。
          IMAGINE_PATH_ARG="IMAGINE_PATH=${{ github.workspace }}"
          
          # 1. 编译 imagine 核心库
          make -f imagine/ios-release.mk install $IMAGINE_PATH_ARG V=1 -j$JOBS
          
          # 2. 编译 EmuFramework 核心库
          make -f EmuFramework/ios-release.mk install $IMAGINE_PATH_ARG V=1 -j$JOBS
          
          # 3. 编译 2600.emu 应用
          make -f 2600.emu/ios-release.mk install $IMAGINE_PATH_ARG V=1 -j$JOBS

      - name: Find and Package IPA
        run: |
          # 查找生成的 .app bundle
          APP_PATH=$(find . -path "*/target/ios-release/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error file=build.yml::Error: Could not find the .app file. The build failed. If this step fails, the previous 'make' step log is required."
            exit 1
          fi
          
          IPA_NAME="2600Emu-IMAGINE-Fix.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2600Emu-IPA-IMAGINE-Fix
          path: 2600Emu-IMAGINE-Fix.ipa
